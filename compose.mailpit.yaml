# Opt-in LOCAL DEVELOPMENT ONLY. No relay/forwarding or production sender.
# docker compose -f compose.yaml -f compose.mailpit.yaml up -d --build
services:
  account-worker:
    build: ./backend
    restart: unless-stopped
    command: ['python','-m','app.account_worker']
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://isave_user:isave_password_change_me@db:5432/isave}
      APP_ENV: ${APP_ENV:-development}
      INVITATION_DELIVERY: mailpit
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-isave-local@example.test}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-5}
      PASSWORD_SETUP_FRONTEND_URL: ${PASSWORD_SETUP_FRONTEND_URL:-http://localhost:3000}
    networks: [default,local_mail]
    depends_on:
      backend:
        condition: service_healthy
  mailpit:
    image: axllent/mailpit:v1.31.6
    environment:
      MP_MAX_MESSAGES: 100
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'
    networks: [local_mail]
  backend:
    environment:
      INVITATION_DELIVERY: mailpit
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-isave-local@example.test}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-5}
      PASSWORD_SETUP_FRONTEND_URL: ${PASSWORD_SETUP_FRONTEND_URL:-http://localhost:3000}
    networks: [default, local_mail]
networks:
  local_mail: {}
