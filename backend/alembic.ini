[alembic]
# path to migration scripts
script_location = alembic

# prepend sys path for the 'app' package import
prepend_sys_path = .

# version location
version_location = alembic/versions

# Database URL. The env.py module overrides this from app.config (DATABASE_URL
# environment variable / .env). Defaults to a local SQLite file for development.
sqlalchemy.url = driver://user:pass@localhost/dbname

# timezone to use when rendering the date
# within the migration files as well as the value of datetime.utcnow().
# See https://alembic.sqlalchemy.org/en/latest/tutorial.html#timezones
# timezone =

# Max length of characters to apply to the version
# code file. See:
# https://alembic.sqlalchemy.org/en/latest/api/config.html
# Config.get_version_length
# version_length = 42

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run on newly
# generated migration scripts. See the documentation for further detail and
# examples
# format = black
# type = python
# entrypoint = black

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
