# Disposable browser/API/PostgreSQL validation. Never mounts the office volume.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: isave_test_browser
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "isave_test_browser"]
      interval: 2s
      timeout: 2s
      retries: 30
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres@db:5432/isave_test_browser
      APP_ENV: development
    ports: ["127.0.0.1:18000:8000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 2s
      timeout: 2s
      retries: 30
  frontend:
    build: .
    environment:
      AUTH_API_ORIGIN: http://backend:8000
    ports: ["127.0.0.1:13000:3000"]
    depends_on:
      backend:
        condition: service_healthy
