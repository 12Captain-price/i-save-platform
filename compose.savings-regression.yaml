# Dedicated backend regression runner; never mounts operational storage.
services:
  db:
    environment:
      POSTGRES_DB: isave_test_savings_regression
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "isave_test_savings_regression"]
  backend:
    environment:
      DATABASE_URL: postgresql+psycopg://postgres@db:5432/isave_test_savings_regression
      APP_ENV: development
      ISAVE_TEST_DATABASE_URL: postgresql+psycopg://postgres@db:5432/isave_test_savings_regression
      TEST_POSTGRES_URL: postgresql+psycopg://postgres@db:5432/postgres
    ports: !override []
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "true"]
