# Isolated synthetic regression target; no host ports and no normal volumes.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway_test
      POSTGRES_PASSWORD: ${GATEWAY_TEST_PASSWORD:?Private synthetic password required}
      POSTGRES_DB: isave_test_gateway
    volumes: [gateway_test_pg:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U gateway_test -d isave_test_gateway']
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    build: {context: ./backend, dockerfile: Dockerfile}
    environment:
      APP_ENV: development
      APP_DEBUG: 'false'
      DATABASE_URL: postgresql+psycopg://gateway_test:${GATEWAY_TEST_PASSWORD}@db/isave_test_gateway
      ISAVE_TEST_DATABASE_URL: postgresql+psycopg://gateway_test:${GATEWAY_TEST_PASSWORD}@db/isave_test_gateway
      TEST_POSTGRES_URL: postgresql+psycopg://gateway_test:${GATEWAY_TEST_PASSWORD}@db/postgres
      INVITATION_DELIVERY: disabled
      CAMPAIGN_DELIVERY_ENABLED: 'false'
    command: [python, -m, pytest, -q, --tb=short]
    depends_on: {db: {condition: service_healthy}}
volumes:
  gateway_test_pg: {}
networks:
  default:
    ipam:
      config: [{subnet: '${GATEWAY_TEST_SUBNET:-10.254.91.0/24}'}]
